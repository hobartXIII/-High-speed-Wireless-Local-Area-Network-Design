          { en: 'A broken cable', zh: '纜線斷掉' },

        en: 'In direct sequence spread spectrum, every data bit is multiplied by a short code of chips. The original 802.11 uses an 11-chip Barker code, so one bit becomes eleven chips and the signal occupies a much wider band at a much lower power density.',

        en: 'What happens to narrowband interference at the receiver?',

      },
      {
        en: 'Which benefit of DSSS is mentioned in the last sentence?',
        zh: '最後一句提到 DSSS 的哪個好處？',

          { en: 'It can separate the main peak from later echoes.', zh: '能把主峰和較晚的回波分開。' },

          { en: 'It uses less bandwidth than any other method.', zh: '比其他方法用更少頻寬。' }
